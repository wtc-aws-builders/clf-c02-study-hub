name: Study Hub checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check cards, build logs and secrets
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          added=$(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD)
          python build/tools/hub.py check --author "$PR_AUTHOR" --added $added

      - name: Make sure the site still builds
        run: python build/tools/hub.py build

      - name: Test the Hub API (once it exists)
        run: |
          if [ -f build/lambda/hub_api/test_handler.py ]; then
            cd build/lambda/hub_api && python -m unittest test_handler.py
          fi
